[project]
name = "ent-weekly-api"
version = "0.1.0"
description = "Auditable daily PubMed monitoring pipeline for ENT Weekly"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
